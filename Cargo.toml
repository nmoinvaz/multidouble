[package]
name = "multidouble"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Double-double and quad-double arithmetic, scalar and 8-lane SIMD (AVX-512, AVX2, SSE2, NEON, portable) with bitwise identical results, dual numbers and double-double LU"
license = "BSD-3-Clause"
repository = "https://github.com/nmoinvaz/multidouble"
readme = "README.md"
keywords = ["double-double", "quad-double", "extended-precision", "simd", "floating-point"]
categories = ["mathematics", "science"]
exclude = ["/.github", "/.claude", "/CLAUDE.md"]

[features]
# Use the plain-array V8 backend whatever the target features, e.g. to compare it with the SIMD ones.
portable = []
# Deliberate breakage of the quad-double algorithms, for the controls of the accuracy tests (qd::mutate).
mutate = []
# Conversions between f128 and DD/QD. Nightly only, f128 is unstable.
f128 = []

[package.metadata.docs.rs]
features = ["f128"]

[dependencies]
rayon = "1.10"

[dev-dependencies]
criterion = "0.8"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[[test]]
name = "f128"
required-features = ["f128"]

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "linalg"
harness = false
