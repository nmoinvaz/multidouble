[package]
name = "multidouble"
version = "4.4.0"
edition = "2021"
rust-version = "1.89"
description = "Double-double, quad-double and octo-double arithmetic, scalar and 8-lane SIMD (AVX-512, AVX2, SSE2, NEON, portable) with bitwise identical results, dual numbers and LU solves"
license = "BSD-3-Clause"
repository = "https://github.com/nmoinvaz/multidouble"
readme = "README.md"
keywords = ["double-double", "quad-double", "extended-precision", "simd", "floating-point"]
categories = ["mathematics", "science"]
exclude = ["/.github", "/.claude", "/CLAUDE.md", "/python"]

[features]
# Use the plain-array V8 backend whatever the target features, e.g. to compare it with the SIMD ones.
portable = []
# Deliberate breakage of the quad-double algorithms, for the controls of the accuracy tests (qd::mutate).
mutate = []
# Conversions between f128 and DD/QD. Nightly only, f128 is unstable.
f128 = []

[package.metadata.docs.rs]
features = ["f128"]

[dependencies]
rayon = "1.10"

[dev-dependencies]
criterion = "0.8"

# A library's profiles do not reach the crates that depend on it, so these serve only this
# repository. The tests (cargo test --release) build without LTO, which would optimize std, the test
# harness and the library again in each test binary and doctest, for the same results.
[profile.release]
opt-level = 3
codegen-units = 1

# The benchmarks measure the library at its fastest, as a fat-LTO release build of a dependent
# crate would have it.
[profile.bench]
codegen-units = 1
lto = "fat"

[[test]]
name = "f128"
required-features = ["f128"]

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "linalg"
harness = false

[[bench]]
name = "field"
harness = false

[[bench]]
name = "jet"
harness = false
