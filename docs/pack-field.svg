<line x1="745.0" y1="192.0" x2="779.0" y2="158.0" stroke="#52514e" stroke-width="0.6"/>
<line x1="752.0" y1="192.0" x2="786.0" y2="158.0" stroke="#52514e" stroke-width="0.6"/>
<line x1="759.0" y1="192.0" x2="793.0" y2="158.0" stroke="#52514e" stroke-width="0.6"/>
<line x1="766.0" y1="192.0" x2="800.0" y2="158.0" stroke="#52514e" stroke-width="0.6"/>
