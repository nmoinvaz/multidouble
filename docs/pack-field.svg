<rect width="856" height="330" fill="#fcfcfb"/>
<text x="16.0" y="22.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">One lower part</text>
<text x="16.0" y="38.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">The 11-bit exponent becomes a 4-bit code: how far the part lies below the last nonzero part above it.</text>
<text x="80.0" y="89.0" font-size="11" fill="#0b0b0b" text-anchor="end" font-weight="normal">raw f64</text>
<rect x="90.0" y="68.0" width="11.0" height="34.0" fill="#eda100"><title>sign</title></rect>
<text x="95.5" y="88.5" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">s</text>
<rect x="101.0" y="68.0" width="121.0" height="34.0" fill="#eb6834"><title>biased exponent e, 11 bits</title></rect>
<text x="161.5" y="88.5" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">exponent e (11)</text>
<rect x="222.0" y="68.0" width="572.0" height="34.0" fill="#2a78d6"><title>fraction, 52 bits</title></rect>
<text x="508.0" y="88.5" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">fraction (52)</text>
