<text x="178.0" y="134.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">code = (e of the last nonzero part above) − e − 53, kept when 0 to 13</text>
<line x1="640.0" y1="104.0" x2="640.0" y2="156.0" stroke="#52514e" stroke-width="1.2"/>
<polygon points="640.0,157.0 636.0,149.0 644.0,149.0" fill="#52514e"/>
<text x="90.0" y="232.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">code</text>
<text x="160.0" y="232.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">meaning</text>
<text x="90.0" y="252.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">0 … 13</text>
<text x="160.0" y="252.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">a normal part whose exponent lies 53 + code below the last nonzero part above it</text>
<text x="90.0" y="272.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">14</text>
<text x="160.0" y="272.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">a zero part, its sign kept in the sign bit</text>
<text x="90.0" y="292.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">15</text>
<text x="160.0" y="292.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">this value is in the side table; the fraction bits hold its index</text>
