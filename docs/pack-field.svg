<text x="95.5" y="206.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">sign byte</text>
<text x="437.0" y="206.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">7-byte field: fraction | code &lt;&lt; 52</text>
<line x1="161.5" y1="104.0" x2="129.0" y2="156.0" stroke="#52514e" stroke-width="1.2"/>
<polygon points="129.0,157.0 125.0,149.0 133.0,149.0" fill="#52514e"/>
<text x="178.0" y="134.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">code = 64 − drop, the drop being (e of the last nonzero part above) − e, 53 to 64</text>
<line x1="657.0" y1="104.0" x2="657.0" y2="156.0" stroke="#52514e" stroke-width="1.2"/>
<polygon points="657.0,157.0 653.0,149.0 661.0,149.0" fill="#52514e"/>
<text x="90.0" y="232.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">code</text>
<text x="160.0" y="232.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">meaning</text>
<text x="90.0" y="252.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">0 … 11</text>
<text x="160.0" y="252.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">a normal part whose exponent lies 64 − code below the last nonzero part above it</text>
<text x="90.0" y="272.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">12</text>
<text x="160.0" y="272.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">a zero part, its sign in the sign byte</text>
<text x="90.0" y="292.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-variant-numeric="tabular-nums">15</text>
<text x="160.0" y="292.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">this value is in the side table; the fraction bits hold its row</text>
<text x="90.0" y="312.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Decoding is one add: the field under a constant top byte 0xfc, plus the exponent above shifted by 52.</text>
</svg>
