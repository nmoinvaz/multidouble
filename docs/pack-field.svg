<text x="80.0" y="179.0" font-size="11" fill="#0b0b0b" text-anchor="end" font-weight="normal">packed</text>
<rect x="90.0" y="158.0" width="11.0" height="34.0" fill="#eda100"><title>sign: one bit of the group's sign byte</title></rect>
<text x="95.5" y="178.5" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">s</text>
<rect x="90.0" y="158.0" width="11.0" height="34.0" fill="none" stroke="#52514e" stroke-width="1"/>
<rect x="107.0" y="158.0" width="44.0" height="34.0" fill="#1baf7a"><title>code, 4 bits</title></rect>
<text x="129.0" y="178.5" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">code</text>
<rect x="151.0" y="158.0" width="572.0" height="34.0" fill="#2a78d6"><title>fraction, 52 bits</title></rect>
<text x="437.0" y="178.5" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">fraction (52)</text>
<rect x="107.0" y="158.0" width="616.0" height="34.0" fill="none" stroke="#52514e" stroke-width="1"/>
<rect x="723.0" y="158.0" width="77.0" height="34.0" fill="#e7e6e2"><title>saved: 7 bits</title></rect>
