<text x="16.0" y="38.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">A block holds the 8 leading parts, then for each lower part the 8 fields and a byte of their signs. get(i) reads block i/8; SIMD decodes a block with byte shuffles.</text>
