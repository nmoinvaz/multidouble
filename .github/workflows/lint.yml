name: Lint
on: [workflow_dispatch, pull_request]
env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run rustfmt
      run: cargo fmt --check

  # The V8 backend is selected by the target and its features, so each backend is its own code to lint.
  clippy:
    name: Clippy ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SSE2
            os: ubuntu-latest
          - name: portable
            os: ubuntu-latest
            features: portable,mutate
          - name: AVX2
            os: ubuntu-latest
            rustflags: -C target-feature=+avx2,+fma
          # --target keeps RUSTFLAGS off the build scripts, which run on a runner that may lack AVX-512
          - name: AVX-512
            os: ubuntu-latest
            rustflags: -C target-feature=+avx512f,+avx2,+fma
            target-args: --target x86_64-unknown-linux-gnu
          - name: NEON
            os: ubuntu-24.04-arm
          # f128 is unstable, so its code is linted on nightly
          - name: f128
            os: ubuntu-latest
            toolchain: nightly
            features: f128,mutate
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install toolchain
      if: matrix.toolchain
      run: |
        rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
        rustup default ${{ matrix.toolchain }}

    - name: Run clippy
      run: cargo clippy --all-targets --features ${{ matrix.features || 'mutate' }} ${{ matrix.target-args }} -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build documentation
      run: cargo doc --no-deps --features portable,mutate
